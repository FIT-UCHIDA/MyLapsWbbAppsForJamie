{% extends "base.html" %}
{% block title %}Select User{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <h3 class="mb-3">Select User Profile</h3>

        <div class="card">
            <div class="card-body">
                <form method="POST" action="{{ url_for('select_user') }}">
                    <div class="mb-3">
                        <label class="form-label">User:</label>
                        <select name="username" class="form-select">
                            <option value="" {% if not current_user %}selected{% endif %}>
                                -- Global (default) --
                            </option>
                            {% for user in users %}
                            <option value="{{ user }}" {% if current_user == user %}selected{% endif %}>
                                {{ user }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    {% if current_user %}
                    <p class="text-muted small">Current: <strong>{{ current_user }}</strong></p>
                    {% endif %}
                    <button type="submit" class="btn btn-primary w-100">Select</button>
                </form>
            </div>
        </div>

        <div class="mt-3">
            <a href="{{ url_for('main_page') }}" class="btn btn-outline-secondary">&larr; Back to Main</a>
        </div>
    </div>
</div>
{% endblock %}
