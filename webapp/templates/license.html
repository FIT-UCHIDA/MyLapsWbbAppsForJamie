{% extends "base.html" %}
{% block title %}License Authentication{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">License Authentication</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('license_page') }}">
                    <div class="mb-3">
                        <label for="license_key" class="form-label">Enter your license key:</label>
                        <input type="text" class="form-control" id="license_key" name="license_key"
                               placeholder="License key" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Verify</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
