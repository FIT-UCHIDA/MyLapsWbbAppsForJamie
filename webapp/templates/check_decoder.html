{% extends "base.html" %}
{% block title %}Decoder Check{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-10">

    <h4 class="mb-3">Decoder Health Check</h4>

    <!-- ========== Check Now ========== -->
    <div class="card mb-4">
      <div class="card-header fw-bold">Check Now</div>
      <div class="card-body">
        <div class="d-flex align-items-center gap-2 flex-wrap mb-3">
          <span class="text-muted small">過去</span>
          <input type="number" id="now-hours" class="form-control form-control-sm"
                 value="2" min="1" max="24" style="width:5rem">
          <span class="text-muted small">時間分をチェック</span>
          <button class="btn btn-primary btn-sm" onclick="checkNow()">Check Now</button>
          <div id="now-spinner" class="spinner-border spinner-border-sm text-primary d-none"></div>
        </div>

        <div id="now-output" class="d-none">
          <!-- Banner -->
          <div id="now-banner" class="alert text-center py-3 mb-3">
            <h4 id="now-banner-title" class="mb-1"></h4>
            <div id="now-banner-sub" class="small"></div>
          </div>
          <!-- Grid -->
          <div id="now-grid" class="row g-2 mb-2"></div>
          <div class="text-muted small">
            Checked: <strong id="now-checked-at">—</strong>
            &ensp;|&ensp; API: <code id="now-api-url" class="small"></code>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== Range Check ========== -->
    <div class="card mb-4">
      <div class="card-header fw-bold">Range Check</div>
      <div class="card-body">
        <div class="row g-2 align-items-end mb-3">
          <div class="col-12 col-sm-5">
            <label class="form-label small mb-1">From (JST)</label>
            <input type="datetime-local" id="range-from" class="form-control form-control-sm">
          </div>
          <div class="col-12 col-sm-5">
            <label class="form-label small mb-1">To (JST)</label>
            <input type="datetime-local" id="range-to" class="form-control form-control-sm">
          </div>
          <div class="col-12 col-sm-2">
            <button class="btn btn-primary btn-sm w-100" onclick="checkRange()">Check</button>
          </div>
        </div>

        <div id="range-spinner" class="text-center d-none py-2">
          <div class="spinner-border spinner-border-sm text-primary"></div> Checking...
        </div>

        <div id="range-output" class="d-none">
          <!-- Banner -->
          <div id="range-banner" class="alert text-center py-3 mb-3">
            <h4 id="range-banner-title" class="mb-1"></h4>
            <div id="range-banner-sub" class="small"></div>
          </div>
          <!-- Grid -->
          <div id="range-grid" class="row g-2 mb-2"></div>
          <div class="text-muted small">
            <span id="range-from-label"></span> → <span id="range-to-label"></span>
            &ensp;|&ensp; API: <code id="range-api-url" class="small"></code>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
{% endblock %}


{% block scripts %}
<script>
const DECODER_ORDER = {{ decoder_order | tojson }};

// -----------------------------------------------------------------------
// Helpers
// -----------------------------------------------------------------------
function fmtDatetime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('ja-JP', {
    month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'
  });
}

function fmtTimeAgo(iso) {
  if (!iso) return '';
  const diffMs  = Date.now() - new Date(iso).getTime();
  const diffMin = Math.round(diffMs / 60000);
  if (diffMin <  1) return 'just now';
  if (diffMin < 60) return `${diffMin}m ago`;
  const hr = (diffMs / 3600000).toFixed(1);
  return `${hr}h ago`;
}

function toParam(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}`;
}

// -----------------------------------------------------------------------
// Render: banner + card grid (shared by both features)
// -----------------------------------------------------------------------
function renderResult(outputId, bannerId, titleId, subId, gridId, data) {
  const output = document.getElementById(outputId);
  output.classList.remove('d-none');

  // Banner
  const banner = document.getElementById(bannerId);
  banner.className = 'alert text-center py-3 mb-3';
  if (data.status === 'ok') {
    banner.classList.add('alert-success');
    document.getElementById(titleId).textContent = '✓  All Decoders OK';
    document.getElementById(subId).textContent   = `${data.total_passings || 0} passings`;
  } else if (data.status === 'error') {
    banner.classList.add('alert-danger');
    document.getElementById(titleId).textContent = '✗  Missing Decoder(s)';
    document.getElementById(subId).textContent   =
      `Missing: ${data.missing.join(', ')} | ${data.total_passings || 0} passings`;
  } else {
    banner.classList.add('alert-warning');
    document.getElementById(titleId).textContent = '⚠  DB Connection Error';
    document.getElementById(subId).textContent   = (data.error || '').slice(0, 100);
  }

  // Card grid
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  const decoders = data.decoders || {};
  const extras   = Object.keys(decoders).filter(k => !DECODER_ORDER.includes(k));
  [...DECODER_ORDER, ...extras].forEach(name => {
    const d = decoders[name];
    if (!d) return;
    const col = document.createElement('div');
    col.className = 'col-6 col-sm-4 col-md-2';
    const border   = d.present ? 'border-success' : 'border-danger';
    const badge    = d.present
      ? '<span class="badge bg-success px-3 py-1">OK</span>'
      : '<span class="badge bg-danger px-3 py-1">MISSING</span>';
    const timeAgo  = d.last_seen ? `<div class="text-muted mt-1" style="font-size:.8rem">${fmtTimeAgo(d.last_seen)}</div>` : '';
    const passLine = d.count > 0 ? `<div class="text-muted" style="font-size:.75rem">${d.count} pass</div>` : '';
    const idLine   = `<div class="text-muted" style="font-size:.65rem">${d.decoder_id || ''}</div>`;
    col.innerHTML = `
      <div class="card ${border} h-100 text-center">
        <div class="card-body p-2">
          <div class="fw-bold fs-5 mb-1">${name}</div>
          ${badge}${timeAgo}${passLine}${idLine}
        </div>
      </div>`;
    grid.appendChild(col);
  });
}

// -----------------------------------------------------------------------
// Check Now
// -----------------------------------------------------------------------
function checkNow() {
  const hours  = parseFloat(document.getElementById('now-hours').value) || 2;
  const now    = new Date();
  const from   = new Date(now.getTime() - hours * 3600000);
  const apiUrl = `/api/decoder_check?from=${toParam(from)}&to=${toParam(now)}`;

  document.getElementById('now-api-url').textContent = apiUrl;
  document.getElementById('now-spinner').classList.remove('d-none');
  document.getElementById('now-output').classList.add('d-none');

  fetch(apiUrl).then(r => r.json()).then(data => {
    document.getElementById('now-spinner').classList.add('d-none');
    renderResult('now-output','now-banner','now-banner-title','now-banner-sub','now-grid', data);
    document.getElementById('now-checked-at').textContent = fmtDatetime(data.to_jst);
  }).catch(err => {
    document.getElementById('now-spinner').classList.add('d-none');
    alert('Error: ' + err.message);
  });
}

// -----------------------------------------------------------------------
// Range Check
// -----------------------------------------------------------------------
function checkRange() {
  const fromVal = document.getElementById('range-from').value;
  const toVal   = document.getElementById('range-to').value;
  if (!fromVal) { alert('From を選択してください'); return; }

  const fromDt = new Date(fromVal);
  const toDt   = toVal ? new Date(toVal) : new Date();
  const apiUrl = `/api/decoder_check?from=${toParam(fromDt)}&to=${toParam(toDt)}`;

  document.getElementById('range-api-url').textContent = apiUrl;
  document.getElementById('range-spinner').classList.remove('d-none');
  document.getElementById('range-output').classList.add('d-none');

  fetch(apiUrl).then(r => r.json()).then(data => {
    document.getElementById('range-spinner').classList.add('d-none');
    renderResult('range-output','range-banner','range-banner-title','range-banner-sub','range-grid', data);
    document.getElementById('range-from-label').textContent = fmtDatetime(data.from_jst);
    document.getElementById('range-to-label').textContent   = fmtDatetime(data.to_jst);
  }).catch(err => {
    document.getElementById('range-spinner').classList.add('d-none');
    alert('Error: ' + err.message);
  });
}

// -----------------------------------------------------------------------
// Init: pre-fill range inputs
// -----------------------------------------------------------------------
(function() {
  const now = new Date();
  const p   = n => String(n).padStart(2,'0');
  document.getElementById('range-from').value =
    `${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}T00:00`;
  document.getElementById('range-to').value =
    `${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}T${p(now.getHours())}:${p(now.getMinutes())}`;
})();
</script>
{% endblock %}
